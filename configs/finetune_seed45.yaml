# 历史方案配置，包含论文以外的奖励、筛选和早停，禁止用于新的复现训练。
# 数值仅保留作旧实验记录/评估；新训练使用 configs/paper_seed45.yaml。
# seed45 短程续训：先复评旧检查点，再追加最多100回合。
# 运动尺度和伪奖励沿用 retrain_seed42；本轮只降低 actor/Q 学习率。
seed: 45
device: auto

paths:
  scene_xml: universal_robots_ur5e/scene.xml
  expert_dir: data/similar_expert
  output_dir: outputs/finetune_seed45

environment:
  max_episode_steps: 500
  frame_skip: 10
  kinematic_control: true
  max_ee_step: 0.015
  ik_iterations: 30
  ik_damping: 0.05
  grasp_radius: 0.015
  cup_tcp_offset: [0.0, 0.0, 0.105]
  blue_mat_center: [0.45, 0.35]
  success_radius: 0.06
  success_z_max: 0.14
  minimum_lift_height: 0.20
  workspace_low: [-0.70, -0.60, 0.12]
  workspace_high: [0.70, 0.60, 0.90]
  initial_joint_noise: 0.0
  initial_cup_xy_noise: 0.0

network:
  hidden_dims: [256, 256]
  mine_hidden_dims: [128, 128]
  activation: relu

tgod:
  num_skills: 8
  mine_learning_rate: 0.00005
  state_mi_weight: 0.05
  demonstration_mi_weight: 0.25
  demonstration_support_weight: 10.0
  demonstration_progress_weight: 5.0
  pseudo_reward_clip: 10.0
  reward_normalization: true
  mine_gradient_clip: 10.0

sac:
  learning_rate: 0.0001
  alpha_learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  replay_size: 200000
  random_steps: 1000
  update_after: 1000
  update_every: 1
  gradient_steps: 1
  bootstrap_on_timeout: false
  target_entropy: auto
  gradient_clip: 10.0

training:
  # 命令使用 --additional-episodes 100 时，自动覆盖为选中检查点回合数+100。
  episodes: 500
  log_every_episodes: 5
  checkpoint_every_episodes: 25
  # 奖励保持一致，保留已累计的归一化统计。
  reset_reward_statistics_on_resume: false
  # latest.pt 和 best_eval.pt 保存有效replay数据；其它快照只保存模型。
  save_replay_buffer: true
  # 旧检查点无replay：轮流采样所有技能，至少约10000步，无梯度更新。
  resume_replay_steps: 10000
  evaluation_every_episodes: 25
  evaluation_episodes_per_skill: 10
  evaluation_seed: 3000045
  # 连续3次随机策略评估排名未改善，提前结束并保留 best_eval.pt。
  early_stop_patience: 3
  match_after_training: false

matching:
  candidate_count: 160
  deterministic_policy: false
  prefer_successful: true
  resample_points: 100
  epsilon: 0.10
  max_iterations: 10000
  tolerance: 1.0e-5
  qpos_weight: 1.0
  tcp_weight: 2.0
  cup_weight: 2.0
  time_weight: 0.25
