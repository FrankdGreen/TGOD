# 复现优先的新实验：从头训练，不接续采用额外奖励的旧 motion_only_seed45。
# 两个等权 MINE 项 + SAC；示范关系特征仍是论文未公开细节的代理假设。
# 沿用旧实验的环境/网络/优化器参数，避免同时引入更多工程调参。
seed: 45
device: auto

paths:
  scene_xml: universal_robots_ur5e/scene.xml
  expert_dir: data/similar_expert
  output_dir: outputs/paper_seed45

environment:
  max_episode_steps: 500
  frame_skip: 10
  kinematic_control: true
  max_ee_step: 0.015
  ik_iterations: 30
  ik_damping: 0.05
  grasp_radius: 0.015
  cup_tcp_offset: [0.0, 0.0, 0.105]
  blue_mat_center: [0.45, 0.35]
  success_radius: 0.06
  success_z_max: 0.14
  minimum_lift_height: 0.20
  workspace_low: [-0.70, -0.60, 0.12]
  workspace_high: [0.70, 0.60, 0.90]
  initial_joint_noise: 0.0
  initial_cup_xy_noise: 0.0

network:
  hidden_dims: [256, 256]
  mine_hidden_dims: [128, 128]
  activation: relu

tgod:
  num_skills: 8
  mine_learning_rate: 0.00005
  state_mi_weight: 1.0
  demonstration_mi_weight: 1.0
  demonstration_support_weight: 0.0
  demonstration_progress_weight: 0.0
  pseudo_reward_clip: null
  reward_normalization: false
  mine_gradient_clip: 10.0

sac:
  learning_rate: 0.0003
  alpha_learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  replay_size: 200000
  random_steps: 1000
  update_after: 1000
  update_every: 1
  gradient_steps: 1
  bootstrap_on_timeout: false
  target_entropy: auto
  gradient_clip: 10.0

training:
  # 固定项目预算；论文“约 2000 轮”没有给出与 episodes/环境步数的精确对应。
  episodes: 2000
  log_every_episodes: 10
  checkpoint_every_episodes: 10
  save_replay_buffer: true
  match_after_training: false

matching:
  candidate_count: 160
  deterministic_policy: false
  prefer_successful: false
  resample_points: 100
  epsilon: 0.10
  max_iterations: 2000
  tolerance: 1.0e-5
  qpos_weight: 1.0
  tcp_weight: 2.0
  cup_weight: 2.0
  time_weight: 0.25
